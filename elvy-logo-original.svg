<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <!-- Gold / Amber Gradient for the Location Pin -->
    <linearGradient id="elvyOrigPinGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fdb927" />
      <stop offset="45%" stop-color="#f5a418" />
      <stop offset="100%" stop-color="#e28c07" />
    </linearGradient>

    <!-- 3D Bevel Dark Gold Shadow on Left Rim -->
    <linearGradient id="elvyOrigBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4710b" />
      <stop offset="60%" stop-color="#9a5e07" />
      <stop offset="100%" stop-color="#7e4a02" />
    </linearGradient>

    <!-- Soft Floor Drop Shadow Filter -->
    <filter id="elvyOrigShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" />
    </filter>
  </defs>

  <style>
    .elvy-orig-text {
      fill: #222429;
    }
    .elvy-orig-tagline {
      fill: #222429;
      font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 1.6px;
    }
    .elvy-orig-trademark {
      fill: #222429;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 700;
    }
    .elvy-orig-swoosh {
      fill: #222429;
    }
  </style>

  <g id="elvy-logo-orig-group">
    <!-- 1. Soft Floor Shadow beneath the pin -->
    <ellipse cx="118" cy="198" rx="42" ry="5.5" fill="#c0c0c0" opacity="0.6" filter="url(#elvyOrigShadow)" />

    <!-- 2. Pin Outer 3D Bevel Base (Left Shadow Layer) -->
    <path d="M 118 194
             C 86 164 52 130 52 92
             C 52 55 81 25 118 25
             C 155 25 184 55 184 92
             C 184 130 150 164 118 194 Z"
          fill="url(#elvyOrigBevelGrad)" />

    <!-- 3. Pin Front Vibrant Face (Offset slightly to right to reveal 3D bevel on left) -->
    <path d="M 119 194
             C 93 164 61 130 61 92
             C 61 58 87 28 121 26
             C 155 26 184 55 184 92
             C 184 130 150 164 119 194 Z"
          fill="url(#elvyOrigPinGrad)" />

    <!-- 4. Stylized 'e' inside Pin (Dark charcoal with crisp white border) -->
    <!-- White outer border for maximum clarity against golden pin -->
    <path d="M 118 84
             H 84
             C 85 68 98 58 114 58
             C 130 58 141 68 142 82
             C 142 85 139 88 135 88
             H 85
             C 86 106 100 118 118 118
             C 130 118 140 111 144 102"
          fill="none"
          stroke="#ffffff"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Charcoal inner body of the 'e' -->
    <path d="M 118 84
             H 86
             C 87 70 98 62 113 62
             C 127 62 137 70 138 82
             H 87
             C 88 103 100 114 116 114
             C 127 114 136 108 140 102"
          fill="none"
          stroke="#202227"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 5. Dynamic Ribbon / Swoosh extending from pin over 'elvy' -->
    <path class="elvy-orig-swoosh"
          d="M 142 78
             C 165 58 200 48 240 54
             C 275 60 298 72 305 78
             C 308 81 306 85 300 85
             C 270 85 240 88 205 98
             C 178 106 155 106 142 98
             Z" />

    <!-- 6. Wordmark 'elvy' -->
    <!-- Letter 'e' -->
    <path class="elvy-orig-text"
          d="M 200 138
             C 190 148 174 153 158 153
             C 134 153 118 136 118 112
             C 118 88 135 71 158 71
             C 181 71 198 88 198 112
             C 198 115 196 117 192 117
             H 129
             C 131 133 143 143 159 143
             C 170 143 181 138 188 130
             L 200 138 Z
             M 187 106
             C 185 93 174 81 158 81
             C 142 81 132 92 130 106
             H 187 Z" />

    <!-- Letter 'l' -->
    <path class="elvy-orig-text"
          d="M 210 60
             V 138
             C 210 148 217 153 228 153
             H 232
             V 143
             H 228
             C 223 143 220 140 220 134
             V 60
             H 210 Z" />

    <!-- Letter 'v' -->
    <path class="elvy-orig-text"
          d="M 242 84
             L 263 142
             C 265 147 269 150 274 150
             C 279 150 283 147 285 142
             L 306 84
             H 295
             L 274 139
             L 253 84
             H 242 Z" />

    <!-- Letter 'y' -->
    <path class="elvy-orig-text"
          d="M 314 84
             L 335 142
             L 348 106
             L 356 84
             H 345
             L 338 106
             L 330 128
             L 318 84
             H 307
             L 329 145
             V 175
             C 329 181 326 184 320 184
             H 316
             V 194
             H 321
             C 333 194 340 187 340 175
             V 145
             L 358 84
             Z" />

    <!-- Registered Trademark symbol ® -->
    <text x="365" y="92" class="elvy-orig-trademark">R</text>

    <!-- Slogan: 'redefining hardware collection' -->
    <text x="156" y="180" class="elvy-orig-tagline">redefining hardware collection</text>
  </g>
</svg>
